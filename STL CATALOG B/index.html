/* ---- GIF pause: swap the playing <img> for a canvas holding its current frame ---- */
function freeze(img){
  if(img._cv||!img.naturalWidth)return;
  const c=document.createElement('canvas');
  c.width=img.naturalWidth;c.height=img.naturalHeight;
  c.getContext('2d').drawImage(img,0,0);
  c.className=img.classList.contains('on')?'on':'';
  c.onclick=img.onclick;
  img.after(c);img.style.display='none';img._cv=c;
}
function unfreeze(img){
  if(img._cv){img._cv.remove();img._cv=null;}
  img.style.display='';
}
function watch(img){
  img.addEventListener('load',()=>{if(gifPaused)freeze(img);});
  if(gifPaused&&img.complete)freeze(img);
}
function setPaused(p){
  gifPaused=p;
  document.querySelectorAll('img[data-gif]').forEach(i=>p?freeze(i):unfreeze(i));
  $('#gp').textContent=$('#gp2').textContent=p?'▶ Play GIFs':'⏸ Pause GIFs';
}
if(!HAS_GIF){$('#gp').style.display='none';$('#gp2').style.display='none';}
$('#gp').onclick=$('#gp2').onclick=()=>setPaused(!gifPaused);

/* ---- grid ---- */
function card(f){
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="im">${f.cover?`<img ${isGif(f.cover)?'data-gif="1" ':''}loading="lazy" decoding="async" src="${f.cover}">`:'no image'}</div>
  <div class="meta"><b title="${esc(f.name)}">${esc(f.name)}</b></div>`;
  c.querySelectorAll('img[data-gif]').forEach(watch);
  c.onclick=()=>openLB(f);return c;
}
function render(){
  const q=$('#q').value.toLowerCase().trim(),mode=$('#sort').value;
  view=DATA.filter(f=>!q||(f.artist+' '+f.name).toLowerCase().includes(q));
  const m=$('#main');m.innerHTML='';
  $('#count').textContent=view.length+' / '+DATA.length;
  if(mode==='flat'){
    const g=document.createElement('div');g.className='grid';
    [...view].sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>g.appendChild(card(f)));m.appendChild(g);return;
  }
  let last=null,g=null;
  view.forEach(f=>{
    if(f.artist!==last){last=f.artist;
      const h=document.createElement('h2');h.textContent=f.artist;m.appendChild(h);
      g=document.createElement('div');g.className='grid';m.appendChild(g);}
    g.appendChild(card(f));
  });
}

/* ---- viewer ---- */
const big=$('#big');
big.addEventListener('load',()=>{if(gifPaused&&big.dataset.gif)freeze(big);});
function show(i){
  idx=i;unfreeze(big);
  const u=cur.imgs[i];
  if(u&&isGif(u))big.dataset.gif='1';else delete big.dataset.gif;
  big.src=u?BASE+u:'';
  $('#strip').querySelectorAll('img').forEach((e,j)=>{
    e.classList.toggle('on',j===i);
    if(e._cv)e._cv.classList.toggle('on',j===i);
    if(j===i)(e._cv||e).scrollIntoView({block:'nearest',inline:'nearest'});
  });
}
function openLB(f){
  cur=f;$('#lbt').textContent=f.artist+'  /  '+f.name+'   ('+f.stl+' STL, '+f.imgs.length+' images)';
  const s=$('#strip');s.innerHTML='';
  f.imgs.forEach((u,i)=>{
    const e=document.createElement('img');e.loading='lazy';e.decoding='async';
    if(isGif(u)){e.dataset.gif='1';watch(e);}
    e.onclick=()=>show(i);e.src=BASE+u;s.appendChild(e);
  });
  $('#lb').classList.add('on');show(0);
}
function closeLB(){unfreeze(big);$('#lb').classList.remove('on');big.removeAttribute('src');$('#strip').innerHTML='';}
$('#x').onclick=closeLB;
$('#cp').onclick=()=>navigator.clipboard.writeText(cur.path);
$('#op').onclick=()=>window.open(cur.uri);
document.addEventListener('keydown',e=>{
  if(!$('#lb').classList.contains('on'))return;
  if(e.key==='Escape')closeLB();
  if(e.key==='ArrowRight'&&idx<cur.imgs.length-1)show(idx+1);
  if(e.key==='ArrowLeft'&&idx>0)show(idx-1);
});
$('#q').oninput=render;$('#sort').onchange=render;
function setZoom(v){document.documentElement.style.setProperty('--w',(500*v/100)+'px');document.documentElement.classList.toggle('tiny',v<20);$('#szv').textContent=v+'%';}
$('#sz').oninput=e=>setZoom(+e.target.value);
setZoom(+$('#sz').value);
render();
</script></body></html>
