<style>
:root{--nfs:14px;--bg:#141417;--card:#1d1d22;--fg:#e8e8ec;--mut:#8a8a94;--acc:#d4af37}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px 'Abel',system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0e0e10ee;backdrop-filter:blur(6px);
  padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #2a2a30}
input,select,textarea{background:#222228;color:var(--fg);border:1px solid #333;border-radius:6px;padding:7px 10px;font:inherit}
#q{flex:1;min-width:200px}
#count{color:var(--mut)}
#zoomwrap{margin-left:auto;display:flex;align-items:center;gap:8px}
main{padding:14px 16px}
h2{margin:24px 0 8px;font-size:16px;color:var(--acc);border-bottom:1px solid #2a2a30;padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,var(--w,500px));justify-content:start;gap:10px 12px}
.card{background:var(--card);border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid transparent}
.card:hover{border-color:var(--acc)}
.card .im{aspect-ratio:1/1;background:#0b0b0d;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.card img,.card canvas{width:100%;height:100%;object-fit:contain;display:block}
.meta{padding:6px 10px}
.meta b{display:block;font-weight:700;font-size:var(--nfs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiny .meta{display:none}
#lb{position:fixed;inset:0;background:#000e;display:none;z-index:10;flex-direction:column}
#lb.on{display:flex}
#lbtop{padding:10px 16px;display:flex;gap:12px;align-items:center}
#lbtop h3{margin:0;flex:1;font-size:15px}
button{background:#2a2a30;color:var(--fg);border:1px solid #3a3a42;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
button:hover{border-color:var(--acc)}
#lbmain{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#lbmain img,#lbmain canvas{max-width:96vw;max-height:100%;object-fit:contain}
#strip{display:flex;flex-wrap:wrap;gap:6px;padding:10px;max-height:190px;overflow-y:auto;justify-content:center;border-top:1px solid #2a2a30}
#strip img,#strip canvas{height:80px;min-width:40px;border-radius:4px;opacity:.55;cursor:pointer;border:2px solid transparent;background:#0b0b0d}
#strip img.on,#strip canvas.on{opacity:1;border-color:var(--acc)}
#wlbar{display:none;align-items:center;gap:10px}
.web #wlbar{display:flex}
#wlbtn{background:var(--acc);color:#16161a;border-color:var(--acc);font-weight:700;font-size:15px;padding:8px 14px;box-shadow:0 0 0 3px #d4af3744}
#wlbtn:hover{filter:brightness(1.12);border-color:#fff}
#wlbtn.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.14)}}
#wlcount{display:inline-block;min-width:22px;text-align:center;background:#16161a;color:var(--acc);border-radius:11px;padding:1px 7px;margin-left:6px}
#quotebtn{background:transparent;color:var(--acc);border-color:var(--acc);font-weight:700;font-size:15px;padding:8px 14px}
#quotebtn:hover{background:var(--acc);color:#16161a}
#quotebtn.dim{opacity:.55}
#wlpanel{display:none;flex-direction:column;align-items:center;gap:8px;padding:8px 16px;border-top:1px solid #2a2a30}
.web #wlpanel{display:flex}
.web #strip{max-height:130px}
#wladd{font-size:15px;padding:8px 16px}
#wladd.on{background:var(--acc);color:#16161a;border-color:var(--acc);font-weight:700}
#wlnotewrap{display:none;width:min(720px,100%)}
#wlnotewrap.on{display:block}
#wlnotes{width:100%;min-height:64px;resize:vertical}
#wm{position:fixed;inset:0;background:#000b;display:none;z-index:20;align-items:center;justify-content:center}
#wm.on{display:flex}
#wmbox{background:var(--card);border:1px solid #333;border-radius:10px;width:min(760px,94vw);max-height:90vh;display:flex;flex-direction:column}
#wmhead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #2a2a30}
#wmhead h3{margin:0;flex:1;font-size:17px}
#wmbody{overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
#wmbody label{display:flex;flex-direction:column;gap:4px}
#wmbody textarea{resize:vertical}
.wi{display:flex;gap:12px;align-items:flex-start;background:#17171b;border-radius:8px;padding:10px}
.wi img{width:72px;height:72px;object-fit:contain;background:#0b0b0d;border-radius:6px;flex:none}
.wi .wb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.wi textarea{min-height:52px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.primary{background:var(--acc);color:#16161a;border-color:var(--acc);font-weight:700}
.msg{color:var(--mut)}
.err{color:#ff8a8a}
.ok{color:#8ae28a}
.ql{margin:0;padding-left:18px}
.ql .msg{white-space:pre-wrap}
</style></head><body>

const QUOTE=null;
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isGif=u=>/\.gif$/i.test(u||'');
const HAS_GIF=DATA.some(f=>isGif(f.cover)||f.imgs.some(isGif));
let view=[],cur=null,idx=0,gifPaused=false;

/* ---- GIF pause: swap the playing <img> for a canvas holding its current frame ---- */
function freeze(img){
  if(img._cv||!img.naturalWidth)return;
  const c=document.createElement('canvas');
  c.width=img.naturalWidth;c.height=img.naturalHeight;
  c.getContext('2d').drawImage(img,0,0);
  c.className=img.classList.contains('on')?'on':'';
  c.onclick=img.onclick;
  img.after(c);img.style.display='none';img._cv=c;
}
function unfreeze(img){
  if(img._cv){img._cv.remove();img._cv=null;}
  img.style.display='';
}
function watch(img){
  img.addEventListener('load',()=>{if(gifPaused)freeze(img);});
  if(gifPaused&&img.complete)freeze(img);
}
function setPaused(p){
  gifPaused=p;
  document.querySelectorAll('img[data-gif]').forEach(i=>p?freeze(i):unfreeze(i));
  $('#gp').textContent=$('#gp2').textContent=p?'▶ Play GIFs':'⏸ Pause GIFs';
}
if(!HAS_GIF){$('#gp').style.display='none';$('#gp2').style.display='none';}
$('#gp').onclick=$('#gp2').onclick=()=>setPaused(!gifPaused);

/* ---- grid ---- */
function card(f){
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="im">${f.cover?`<img ${isGif(f.cover)?'data-gif="1" ':''}loading="lazy" decoding="async" src="${f.cover}">`:'no image'}</div>
  <div class="meta"><b title="${esc(f.name)}">${esc(f.name)}</b></div>`;
  c.querySelectorAll('img[data-gif]').forEach(watch);
  c.onclick=()=>openLB(f);return c;
}
function render(){
  const q=$('#q').value.toLowerCase().trim(),mode=$('#sort').value;
  view=DATA.filter(f=>!q||(f.artist+' '+f.name).toLowerCase().includes(q));
  const m=$('#main');m.innerHTML='';
  $('#count').textContent=view.length+' / '+DATA.length;
  if(mode==='flat'){
    const g=document.createElement('div');g.className='grid';
    [...view].sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>g.appendChild(card(f)));m.appendChild(g);return;
  }
  let last=null,g=null;
  view.forEach(f=>{
    if(f.artist!==last){last=f.artist;
      const h=document.createElement('h2');h.textContent=f.artist;m.appendChild(h);
      g=document.createElement('div');g.className='grid';m.appendChild(g);}
    g.appendChild(card(f));
  });
}

/* ---- viewer ---- */
const big=$('#big');
big.addEventListener('load',()=>{if(gifPaused&&big.dataset.gif)freeze(big);});
function show(i){
  idx=i;unfreeze(big);
  $('#lbn').textContent=cur.imgs.length?'  ·  image '+(i+1)+' of '+cur.imgs.length:'';
  const u=cur.imgs[i];
  if(u&&isGif(u))big.dataset.gif='1';else delete big.dataset.gif;
  big.src=u?BASE+u:'';
  $('#strip').querySelectorAll('img').forEach((e,j)=>{
    e.classList.toggle('on',j===i);
    if(e._cv)e._cv.classList.toggle('on',j===i);
    if(j===i)(e._cv||e).scrollIntoView({block:'nearest',inline:'nearest'});
  });
}
function openLB(f){
  cur=f;$('#lbt').textContent=f.artist+'  /  '+f.name+'   ('+f.stl+' STL, '+f.imgs.length+' images)';
  const s=$('#strip');s.innerHTML='';
  f.imgs.forEach((u,i)=>{
    const e=document.createElement('img');e.loading='lazy';e.decoding='async';
    if(isGif(u)){e.dataset.gif='1';watch(e);}
    e.onclick=()=>show(i);e.src=BASE+u;s.appendChild(e);
  });
  $('#lb').classList.add('on');show(0);refreshWl();
}
function closeLB(){unfreeze(big);$('#lb').classList.remove('on');big.removeAttribute('src');$('#strip').innerHTML='';}
$('#x').onclick=closeLB;
$('#cp').onclick=()=>navigator.clipboard.writeText(cur.path);
$('#op').onclick=()=>window.open(cur.uri);
if(WEB)$('#op').style.display='none';
document.addEventListener('keydown',e=>{
  const t=e.target,typing=t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT');
  if($('#wm').classList.contains('on')){if(e.key==='Escape')closeWM();return;}
  if(!$('#lb').classList.contains('on'))return;
  if(typing){if(e.key==='Escape')t.blur();return;}
  if(e.key==='Escape')closeLB();
  if(e.key==='ArrowRight'&&idx<cur.imgs.length-1)show(idx+1);
  if(e.key==='ArrowLeft'&&idx>0)show(idx-1);
});
$('#q').oninput=render;$('#sort').onchange=render;
function setZoom(v){document.documentElement.style.setProperty('--w',(500*v/100)+'px');document.documentElement.classList.toggle('tiny',v<20);$('#szv').textContent=v+'%';}
$('#sz').oninput=e=>setZoom(+e.target.value);
setZoom(+$('#sz').value);

/* ---- wishlist + quote request (web mode only) ---- */
const WL_KEY='catalogWishlist.v1',WL_MAX=50;
const BYPATH={};DATA.forEach(f=>{BYPATH[f.path]=f;});
let wl={};
try{wl=JSON.parse(localStorage.getItem(WL_KEY)||'{}')||{};}catch(e){wl={};}
Object.keys(wl).forEach(p=>{if(!BYPATH[p])delete wl[p];});
function wlSave(){try{localStorage.setItem(WL_KEY,JSON.stringify(wl));}catch(e){}}
function wlCount(){return Object.keys(wl).length;}
function wlUpdateBar(bump){
  $('#wlcount').textContent=wlCount();
  $('#quotebtn').classList.toggle('dim',!wlCount());
  if(bump){const b=$('#wlbtn');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');}
}
function refreshWl(){
  if(!WEB||!cur)return;
  const on=!!wl[cur.path];
  $('#wladd').textContent=on?'✓ In my wishlist (click to remove)':'♡ Add to my wishlist';
  $('#wladd').classList.toggle('on',on);
  $('#wlnotewrap').classList.toggle('on',on);
  $('#wlnotes').value=on?(wl[cur.path].notes||''):'';
}
$('#wladd').onclick=()=>{
  if(!cur)return;
  if(wl[cur.path]){
    if(wl[cur.path].notes&&!confirm('Remove this figure and your notes from the wishlist?'))return;
    delete wl[cur.path];
  }else{
    if(wlCount()>=WL_MAX){alert('Your wishlist is full ('+WL_MAX+' figures). Please send a request or remove some figures first.');return;}
    wl[cur.path]={notes:'',added:Date.now()};
  }
  wlSave();refreshWl();wlUpdateBar(true);
  if(wl[cur.path])$('#wlnotes').focus();
};
$('#wlnotes').oninput=e=>{if(cur&&wl[cur.path]){wl[cur.path].notes=e.target.value;wlSave();}};

function openWM(){$('#wm').classList.add('on');}
function closeWM(){$('#wm').classList.remove('on');}
$('#wmx').onclick=closeWM;
$('#wm').onclick=e=>{if(e.target.id==='wm')closeWM();};
const EMPTY='<div class="msg">Your wishlist is empty. Open a figure and click “Add to my wishlist”.</div>';

function viewWishlist(){
  $('#wmt').textContent='My wishlist ('+wlCount()+')';
  const body=$('#wmbody');body.innerHTML='';
  const paths=Object.keys(wl);
  if(!paths.length){body.innerHTML=EMPTY;openWM();return;}
  paths.forEach(p=>{
    const f=BYPATH[p],d=document.createElement('div');d.className='wi';
    d.innerHTML=(f.cover?'<img src="'+f.cover+'">':'')+'<div class="wb"><b>'+esc(f.artist)+' / '+esc(f.name)+'</b>'
      +'<span class="msg">'+f.stl+' STL · '+f.imgs.length+' images</span>'
      +'<textarea maxlength="1000" placeholder="Notes on the variation(s) you would like"></textarea>'
      +'<div class="row"><button class="vw">View images</button><button class="rm">Remove</button></div></div>';
    const ta=d.querySelector('textarea');ta.value=wl[p].notes||'';
    ta.oninput=()=>{wl[p].notes=ta.value;wlSave();};
    d.querySelector('.vw').onclick=()=>{closeWM();openLB(f);};
    d.querySelector('.rm').onclick=()=>{delete wl[p];wlSave();wlUpdateBar(false);refreshWl();viewWishlist();};
    body.appendChild(d);
  });
  const r=document.createElement('div');r.className='row';
  r.innerHTML='<button class="primary" id="goquote">Request a quote</button>';
  body.appendChild(r);$('#goquote').onclick=viewQuote;
  openWM();
}

function viewQuote(){
  $('#wmt').textContent='Request a quote';
  const body=$('#wmbody');body.innerHTML='';
  const paths=Object.keys(wl);
  if(!paths.length){body.innerHTML=EMPTY;openWM();return;}
  const items=paths.map(p=>'<li><b>'+esc(BYPATH[p].artist)+' / '+esc(BYPATH[p].name)+'</b>'+(wl[p].notes?'<div class="msg"></div>':'')+'</li>').join('');
  body.innerHTML='<div class="msg">'+paths.length+' figure'+(paths.length>1?'s':'')+' in your request:</div><ul class="ql">'+items+'</ul>'
    +'<label>Your name<input id="qn" autocomplete="name" maxlength="120"></label>'
    +'<label>Your email (so we can reply)<input id="qe" type="email" autocomplete="email" maxlength="200"></label>'
    +'<label>Anything else you would like us to know (optional)<textarea id="qm" maxlength="1500" rows="3"></textarea></label>'
    +(QUOTE?'<div class="msg">Your name, email and notes will be emailed to the shop owner so they can reply with a quote.</div>'
            :'<div class="err">Sending is not set up on this catalog yet.</div>')
    +'<div class="row"><button class="primary" id="qsend">Send request</button><button id="qback">Back to wishlist</button></div><div id="qstatus" class="msg"></div>';
  body.querySelectorAll('.ql li').forEach((li,i)=>{const n=wl[paths[i]].notes;if(n)li.querySelector('.msg').textContent=n;});
  if(!QUOTE)$('#qsend').disabled=true;
  $('#qsend').onclick=sendQuote;$('#qback').onclick=viewWishlist;
  openWM();
}

let lastSend=0,sending=false;
async function sendQuote(){
  const st=$('#qstatus'),name=$('#qn').value.trim(),email=$('#qe').value.trim(),msg=$('#qm').value.trim();
  const fail=t=>{st.className='err';st.textContent=t;};
  if(!name)return fail('Please enter your name.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return fail('Please enter a valid email address so we can reply.');
  if(!wlCount())return fail('Your wishlist is empty.');
  if(!QUOTE)return fail('Sending is not set up on this catalog yet.');
  if(sending||Date.now()-lastSend<20000)return fail('Please wait a moment before sending again.');
  sending=true;$('#qsend').disabled=true;st.className='msg';st.textContent='Sending…';
  try{
    const ps=Object.keys(wl);
    const lines=['New quote request from the catalog','','Name: '+name,'Email: '+email];
    if(msg)lines.push('Message: '+msg);
    lines.push('','Figures ('+ps.length+'):','');
    ps.forEach((p,k)=>{const f=BYPATH[p];lines.push((k+1)+'. '+f.artist+' / '+f.name,'   Folder: '+f.path+'  ('+f.stl+' STL, '+f.imgs.length+' images)','   Notes: '+(wl[p].notes||'(none)'),'');});
    lines.push('Sent from: '+location.href.split('#')[0]);
    const r=await fetch(QUOTE.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({access_key:QUOTE.accessKey,subject:'New quote request ('+ps.length+' figure'+(ps.length>1?'s':'')+')',from_name:'Catalog wishlist',name:name,email:email,message:lines.join('\n')})});
    let j={};try{j=await r.json();}catch(e){}
    if(!r.ok||j.success===false)throw new Error(j.message||('HTTP '+r.status));
    lastSend=Date.now();
    wl={};wlSave();wlUpdateBar(false);refreshWl();
    $('#wmt').textContent='Request sent';
    $('#wmbody').innerHTML='<div class="ok">Thank you! Your request was sent. We will reply to '+esc(email)+'.</div><div class="row"><button id="qdone">Close</button></div>';
    $('#qdone').onclick=closeWM;
  }catch(e){
    fail('Sorry, the request could not be sent ('+(e.message||'network error')+'). Your wishlist is still saved, so please try again.');
  }finally{sending=false;const b=$('#qsend');if(b)b.disabled=!QUOTE;}
}
$('#wlbtn').onclick=viewWishlist;$('#quotebtn').onclick=viewQuote;
if(WEB){document.documentElement.classList.add('web');wlUpdateBar(false);}
render();
</script></body></html>
